name: Hungry_App
description: "Hungry App"
publish_to: 'none'

version: 1.8.8+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  gap: ^3.0.1
  dio: ^5.9.0
  shared_preferences: ^2.5.1
  bloc: ^9.2.1
  skeletonizer: ^2.1.3
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/splach/
    - assets/test/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/food.jpg"
